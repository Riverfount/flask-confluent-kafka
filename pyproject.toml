[project]
name = "flask-confluent-kafka"
version = "0.1.1"
description = "A simple Flask extension for integrating Confluent Kafka."
authors = [{name = "River", email = "vicente.marcal@gmail.com"}]
license = {text = "GPL+v3"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.13.0",
    "flask>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.13",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/flask_confluent_kafka"]
strict = true

[tool.coverage.run]
source = ["src/flask_confluent_kafka"]

[tool.coverage.report]
fail_under = 90
show_missing = true
